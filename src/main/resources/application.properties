# Configuracion del servidor
server.port=9090

# Configuracion de PostgreSQL
# Usa la variable de entorno si existe, si no, usa localhost (para tu PC)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Lopez2003}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.profiles.active=no-security

# Configuracion JPA Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

